[workspace]
members = [
  "engine/core",
  "engine/net",
  "engine/server",
  "engine/client",
  "engine/net-debug",
  "games/dreamwake/simulation",
  "games/dreamwake/protocol",
  "games/dreamwake/server",
  "games/dreamwake/client",
]
resolver = "2"
default-members = ["games/dreamwake/client"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
bincode = "1.3"
blake3 = "=1.8.7"
parry3d = { version = "=0.30.2", default-features = false, features = ["required-features", "std", "enhanced-determinism"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
env_logger = "0.11.8"
log = "0.4.22"
renet = "2.0.0"
renet-cross = "0.6.1"
rtrb = "0.4"
bevy-net-debug = { path = "engine/net-debug" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "net",
] }

# Bevy's ECS and renderer need optimization for ordinary native development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser iteration: optimized dependencies, incremental game code, no whole-program LTO.
[profile.web-dev]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
lto = false
codegen-units = 256

[profile.web-dev.package."*"]
opt-level = 3

# R2 hosts the WASM: prioritize runtime optimization over the Pages file-size limit.
[profile.web-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3

[patch.crates-io]
renet = { path = "../renet-cross/vendor/renet" }
renetcode = { path = "../renet-cross/vendor/renetcode" }
renet-cross = { path = "../renet-cross" }
sctp-proto = { git = "https://github.com/dt665m/sctp-proto.git", rev = "cb94f37991c185fb9cc2fd41fbe92965e2a1f713" }
str0m = { git = "https://github.com/dt665m/str0m.git", rev = "591de71f4588b59e4850007414c6315a93943794" }

[package]
license.workspace = true
name = "game_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = ["default", "bevy_dev_tools"] }
game_shared = { path = "../game_shared" }
game_sim = { path = "../game_sim", features = ["bevy"] }
log.workspace = true
renet.workspace = true
renet-cross.workspace = true
bevy-net-debug.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
game_server = { path = "../game_server" }
ureq = "2.12.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = ["Window", "Location", "RequestInit", "Response", "AbortController", "AbortSignal"] }

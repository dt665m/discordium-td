[workspace]
members = ["game_shared", "game_server", "game_client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bincode = "1.3"
clap = { version = "4.5.53", features = ["derive", "env"] }
env_logger = "0.11.8"
log = "0.4.22"
renet = "2.0.0"
renet-cross = "0.1.0" 
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "net"] }

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3

[package]
license.workspace = true
name = "game_client"
default-run = "game_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "audio", "wav"] }
game_replication = { path = "../shared/replication" }
game_shared = { path = "../shared/protocol" }
game_sim = { path = "../shared/simulation", features = ["bevy"] }
game_dream_net = { path = "../shared/dream_net" }
log.workspace = true
renet.workspace = true
renet-cross.workspace = true
bevy-net-debug.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["default"] }
clap.workspace = true
game_server = { path = "../game_server" }
ureq = "2.12.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Keep the browser bundle within Pages' per-file limit by enabling only the
# rendering/UI plugins we use (no audio, glTF loader, or post-processing plugins).
bevy = { workspace = true, features = [
  "default_app", "default_platform", "3d_api", "bevy_pbr",
  "bevy_gizmos_render", "bevy_ui_render", "bevy_scene", "ui_picking",
] }
getrandom = { version = "0.2.17", features = ["js"] }
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = ["Window", "Location", "RequestInit", "Response", "AbortController", "AbortSignal"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discordium TD Web Client</title>
    <style>
      :root {
        --bg-top: #dce8ff;
        --bg-bottom: #f2f7ff;
        --text-main: #0e1a2b;
        --text-muted: #3b5069;
        --panel-bg: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(74, 94, 122, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 14px 12px 20px;
        background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      .top-note {
        width: min(96vw, 1180px);
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      }

      .top-note h1 {
        margin: 0;
        font-size: clamp(16px, 2.2vw, 22px);
      }

      .top-note p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: clamp(12px, 1.5vw, 14px);
      }

      canvas {
        display: block;
        width: min(96vw, 1180px);
        max-height: calc(100svh - 130px);
        height: auto;
        border-radius: 14px;
        border: 1px solid rgba(74, 94, 122, 0.3);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.2);
        touch-action: none;
      }
    </style>
    <link
      data-trunk
      rel="rust"
      data-bin="game_client"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --strip-debug --strip-dwarf --strip-producers"
    />
  </head>
  <body>
    <section class="top-note">
      <h1>Discordium TD</h1>
      <p>Web client hosted by Trunk. Start the game server separately, then connect from menu.</p>
    </section>
  </body>
</html>

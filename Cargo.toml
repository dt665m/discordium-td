[workspace]
members = ["shared/protocol", "shared/simulation", "shared/replication", "shared/dream_net", "game_server", "game_client", "shared/bevy-net-debug"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
bincode = "1.3"
clap = { version = "4.5.53", features = ["derive", "env"] }
env_logger = "0.11.8"
log = "0.4.22"
renet = "2.0.0"
renet-cross = "0.6.1"
rtrb = "0.4"
bevy-net-debug = { path = "shared/bevy-net-debug" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "net",
] }

# Browser iteration: optimized dependencies, incremental game code, no whole-program LTO.
[profile.web-dev]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
lto = false
codegen-units = 256

[profile.web-dev.package."*"]
opt-level = 3

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3

[patch.crates-io]
sctp-proto = { git = "https://github.com/dt665m/sctp-proto.git", rev = "cb94f37991c185fb9cc2fd41fbe92965e2a1f713" }
str0m = { git = "https://github.com/dt665m/str0m.git", branch = "feat/dimpl-buffer-resize" }
